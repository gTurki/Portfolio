<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cf0b4"/>
      <stop offset="1" stop-color="#19c98a"/>
    </linearGradient>
  </defs>
  <!-- Dark rounded tile with a faint green edge -->
