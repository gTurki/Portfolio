spring.application.name=Portfolio
# Cloud hosts (Railway, Render, ...) inject PORT; locally it's 8080
server.port=${PORT:8080}
# Behind Railway's HTTPS proxy: trust X-Forwarded-Proto/Host so the app sees its public https URL.
# Without this, browser POSTs (Origin: https://...) look cross-origin and are rejected with 403.
server.forward-headers-strategy=framework

# ---------- MySQL ----------
# Locally: localhost:3306/portfolio_db as root with no password (override with DB_USERNAME / DB_PASSWORD).
# On Railway: the MySQL plugin's MYSQLHOST / MYSQLPORT / MYSQLDATABASE / MYSQLUSER / MYSQLPASSWORD are used.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:portfolio_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:${DB_USERNAME:root}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
# SQL logging is on locally; set SHOW_SQL=false in production
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:true}
spring.jpa.open-in-view=false

# ---------- App ----------
# Extra origin allowed to call /api/** (e.g. a separate React/Vite dev server).
# The bundled static UI is same-origin and does not need this.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
# Insert sample projects/skills on startup when the tables are empty
app.seed-sample-data=true
