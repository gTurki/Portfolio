spring.application.name=Portfolio
server.port=8080

# ---------- MySQL ----------
# Credentials come from env vars DB_USERNAME / DB_PASSWORD (set them in the IntelliJ run config),
# falling back to the placeholders below.
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- App ----------
# Extra origin allowed to call /api/** (e.g. a separate React/Vite dev server).
# The bundled static UI is same-origin and does not need this.
app.cors.allowed-origin=http://localhost:5173
# Insert sample projects/skills on startup when the tables are empty
app.seed-sample-data=true
